<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 85 560 330" role="img" aria-labelledby="acctTitle acctDesc">
  <title id="acctTitle">ACME accounting workspace</title>
  <desc id="acctDesc">Ledger books, invoices, calculator, folders, and coins representing accounting and finance</desc>
  <defs>
    <linearGradient id="deskGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00acd2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#233652" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="navyCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b4560"/>
      <stop offset="100%" stop-color="#1a2f44"/>
    </linearGradient>
    <linearGradient id="cyanFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ec8e4"/>
      <stop offset="100%" stop-color="#00acd2"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9f3fa"/>
      <stop offset="50%" stop-color="#83acbd"/>
      <stop offset="100%" stop-color="#4f7f93"/>
    </linearGradient>
    <linearGradient id="ledgerBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#205d75"/>
      <stop offset="100%" stop-color="#00acd2"/>
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#04101e" flood-opacity="0.34"/>
    </filter>
    <filter id="softShadowSm" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#04101e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Ambient soft base (transparent-looking, no hard box) -->
  <ellipse cx="340" cy="412" rx="230" ry="22" fill="#04101e" opacity="0.22"/>
  <ellipse cx="340" cy="400" rx="210" ry="14" fill="url(#deskGlow)"/>

  <!-- Back folder -->
  <g filter="url(#softShadow)">
    <path d="M148 118h92l18 18h150c12 0 22 10 22 22v168c0 12-10 22-22 22H148c-12 0-22-10-22-22V140c0-12 10-22 22-22z" fill="#83acbd"/>
    <path d="M148 136h248c8 0 14 6 14 14v154c0 8-6 14-14 14H148c-8 0-14-6-14-14V150c0-8 6-14 14-14z" fill="#c5d9e3"/>
  </g>

  <!-- Front ledger book -->
  <g filter="url(#softShadow)" transform="translate(78 156) rotate(-8)">
    <rect x="0" y="0" width="168" height="210" rx="14" fill="url(#ledgerBlue)"/>
    <rect x="14" y="14" width="140" height="182" rx="8" fill="url(#paper)"/>
    <rect x="28" y="36" width="78" height="8" rx="4" fill="#83acbd"/>
    <rect x="28" y="56" width="112" height="6" rx="3" fill="#233652" opacity="0.18"/>
    <rect x="28" y="74" width="100" height="6" rx="3" fill="#233652" opacity="0.14"/>
    <rect x="28" y="92" width="108" height="6" rx="3" fill="#233652" opacity="0.12"/>
    <rect x="28" y="120" width="48" height="10" rx="5" fill="#00acd2"/>
    <rect x="28" y="148" width="96" height="6" rx="3" fill="#233652" opacity="0.12"/>
    <rect x="28" y="166" width="84" height="6" rx="3" fill="#233652" opacity="0.1"/>
    <path d="M0 18h10c6 0 10 4 10 10v154c0 6-4 10-10 10H0" fill="#101527" opacity="0.28"/>
  </g>

  <!-- Invoice stack -->
  <g filter="url(#softShadowSm)" transform="translate(268 132) rotate(7)">
    <rect x="10" y="12" width="168" height="210" rx="12" fill="#d7e7ef"/>
    <rect x="0" y="0" width="168" height="210" rx="12" fill="url(#paper)"/>
    <rect x="18" y="22" width="70" height="10" rx="5" fill="#00acd2"/>
    <rect x="18" y="44" width="120" height="6" rx="3" fill="#233652" opacity="0.16"/>
    <rect x="18" y="60" width="104" height="6" rx="3" fill="#233652" opacity="0.12"/>
    <rect x="18" y="76" width="112" height="6" rx="3" fill="#233652" opacity="0.1"/>
    <rect x="18" y="104" width="132" height="1.5" fill="#83acbd" opacity="0.55"/>
    <rect x="18" y="118" width="88" height="6" rx="3" fill="#233652" opacity="0.12"/>
    <rect x="18" y="136" width="76" height="6" rx="3" fill="#233652" opacity="0.1"/>
    <rect x="18" y="154" width="98" height="6" rx="3" fill="#233652" opacity="0.1"/>
    <rect x="18" y="178" width="54" height="14" rx="7" fill="#205d75"/>
  </g>

  <!-- Receipt -->
  <g filter="url(#softShadowSm)" transform="translate(430 168) rotate(14)">
    <path d="M0 10h96v150l-8-6-8 6-8-6-8 6-8-6-8 6-8-6-8 6-8-6-8 6-8-6-8 6V10z" fill="url(#paper)"/>
    <rect x="14" y="26" width="48" height="7" rx="3.5" fill="#00acd2"/>
    <rect x="14" y="44" width="68" height="5" rx="2.5" fill="#233652" opacity="0.14"/>
    <rect x="14" y="58" width="58" height="5" rx="2.5" fill="#233652" opacity="0.12"/>
    <rect x="14" y="72" width="64" height="5" rx="2.5" fill="#233652" opacity="0.1"/>
    <rect x="14" y="96" width="40" height="8" rx="4" fill="#83acbd"/>
  </g>

  <!-- Calculator -->
  <g filter="url(#softShadow)" transform="translate(458 250) rotate(-6)">
    <rect x="0" y="0" width="128" height="158" rx="16" fill="url(#navyCard)"/>
    <rect x="12" y="14" width="104" height="36" rx="8" fill="#101527"/>
    <rect x="20" y="24" width="52" height="8" rx="4" fill="#7fe0f4" opacity="0.85"/>
    <g fill="#e6eef2">
      <rect x="14" y="64" width="28" height="22" rx="6"/>
      <rect x="50" y="64" width="28" height="22" rx="6"/>
      <rect x="86" y="64" width="28" height="22" rx="6"/>
      <rect x="14" y="94" width="28" height="22" rx="6"/>
      <rect x="50" y="94" width="28" height="22" rx="6"/>
      <rect x="86" y="94" width="28" height="22" rx="6" fill="#00acd2"/>
      <rect x="14" y="124" width="28" height="22" rx="6"/>
      <rect x="50" y="124" width="28" height="22" rx="6"/>
      <rect x="86" y="124" width="28" height="22" rx="6" fill="url(#cyanFace)"/>
    </g>
  </g>

  <!-- Wallet -->
  <g filter="url(#softShadowSm)" transform="translate(250 318)">
    <rect x="0" y="18" width="126" height="78" rx="14" fill="#205d75"/>
    <rect x="8" y="8" width="110" height="70" rx="12" fill="#2f6f88"/>
    <rect x="78" y="30" width="28" height="26" rx="8" fill="#00acd2"/>
    <circle cx="92" cy="43" r="5" fill="#101527" opacity="0.35"/>
  </g>

  <!-- Coins -->
  <g filter="url(#softShadowSm)">
    <ellipse cx="196" cy="362" rx="28" ry="28" fill="url(#coin)"/>
    <ellipse cx="196" cy="358" rx="18" ry="18" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>
    <ellipse cx="228" cy="376" rx="22" ry="22" fill="url(#coin)"/>
    <ellipse cx="228" cy="373" rx="13" ry="13" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5"/>
    <ellipse cx="168" cy="384" rx="18" ry="18" fill="url(#coin)"/>
  </g>

  <!-- Small binder clip / accent tablet -->
  <g filter="url(#softShadowSm)" transform="translate(392 98)">
    <rect x="0" y="18" width="110" height="72" rx="12" fill="url(#navyCard)"/>
    <rect x="12" y="32" width="54" height="8" rx="4" fill="#83acbd"/>
    <rect x="12" y="48" width="78" height="6" rx="3" fill="#e6e6e6" opacity="0.35"/>
    <rect x="12" y="62" width="62" height="6" rx="3" fill="#e6e6e6" opacity="0.22"/>
    <circle cx="92" cy="54" r="14" fill="#00acd2"/>
    <path d="M86 54h12M92 48v12" stroke="#101527" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
