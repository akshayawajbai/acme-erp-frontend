<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/acme-logo.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ACME ERP demonstration frontend" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>ACME ERP</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('acme.theme');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = mode === 'dark' || (mode === 'system' && systemDark) ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-theme-mode', mode);

          var appearanceRaw = localStorage.getItem('acme.appearance');
          if (!appearanceRaw) {
            return;
          }
          var appearance = JSON.parse(appearanceRaw);
          if (!appearance || typeof appearance !== 'object') {
            return;
          }
          function isHex(value) {
            return typeof value === 'string' && /^#([0-9a-fA-F]{6})$/.test(value);
          }
          if (isHex(appearance.primaryColor)) {
            root.style.setProperty('--color-primary', appearance.primaryColor.toLowerCase());
          }
          if (isHex(appearance.accentColor)) {
            root.style.setProperty('--color-accent', appearance.accentColor.toLowerCase());
            root.style.setProperty('--color-header', appearance.accentColor.toLowerCase());
            root.style.setProperty('--color-brand-teal', appearance.accentColor.toLowerCase());
            root.style.setProperty('--color-focus', appearance.accentColor.toLowerCase());
          }
          if (appearance.density === 'compact' || appearance.density === 'comfortable') {
            root.setAttribute('data-density', appearance.density);
          }
          if (appearance.fontScale === '95' || appearance.fontScale === '100' || appearance.fontScale === '110') {
            root.style.setProperty('--font-scale', String(Number(appearance.fontScale) / 100));
          }
          if (typeof appearance.cardRadius === 'number') {
            root.style.setProperty('--card-radius', appearance.cardRadius + 'px');
          }
          if (appearance.cardBorderVisible === false) {
            root.style.setProperty('--card-border-width', '0');
          }
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
